name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: memberos
          POSTGRES_DB: memberos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # With CI set, database tests fail instead of skipping when this is missing.
      TEST_DATABASE_URL: postgres://postgres:memberos@localhost:5432/memberos_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t memberos:ci .
      - name: Image starts and rejects missing configuration
        run: |
          if docker run --rm memberos:ci 2>err.txt; then echo "started without configuration" >&2; exit 1; fi
          grep -q "TELEGRAM_BOT_ID" err.txt
